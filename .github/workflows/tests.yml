name: Tests

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      # The lock is part of what gets built. A change to it changes the code
      # that compiles even when nothing in Sources moved, so it has to be able
      # to turn the gate red on its own.
      - "Package.resolved"
      - ".github/workflows/tests.yml"
  # Every pull request, not only those targeting main: work on this repository
  # arrives as a stack of branches, and a stacked pull request needs the same
  # gate as the one at the bottom of the stack.
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/tests.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted, not self-hosted: this repository is public, so a pull
    # request from a fork would otherwise run a stranger's code on a
    # maintainer's own machine.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Run Tests
        run: swift test

  linux:
    # The platform most operators will actually run this on, and the one the
    # storage layer is most sensitive to: it picks a system library and
    # branches on how a volume is identified, and only this lane sees either.
    # Everything merged before persistence was arithmetic that behaves
    # identically on both platforms, which is exactly why nobody noticed there
    # was no Linux gate. BUILD-5 cannot be claimed without it.
    #
    # GitHub-hosted for the same reason the macOS job is: a fork's pull request
    # must never run on a maintainer's machine.
    runs-on: ubuntu-latest
    # The official image, at the version the package declares in
    # `swift-tools-version`. Pinning the minor rather than tracking `latest`
    # means the gate tests the floor an operator is promised, instead of
    # whatever toolchain happened to ship the week the job ran.
    container:
      image: swift:6.1-noble
      # Not as root. The image's default user is root, and root ignores the
      # permission bits a filesystem sets, so a test that makes a directory
      # unwritable to prove a backup cannot be taken proves nothing there and
      # fails on the assertion that an error was thrown. Production does not
      # run as root either: the container this ships in runs unprivileged, so
      # the lane that is supposed to be the closest thing to production should
      # not be the one place the process can do anything it likes.
      options: --user 1000:1000
    env:
      # `useradd` is not run, so uid 1000 has no home in /etc/passwd and the
      # toolchain needs somewhere writable for its caches.
      HOME: /tmp
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Swift version
        # Printed rather than assumed: when this job fails on a toolchain
        # difference, the first thing anybody reading the log wants is which
        # toolchain it was.
        run: swift --version

      # The one thing this package needs that a toolchain does not bring. It is
      # installed here rather than assumed, so the prerequisite is stated by
      # something that runs rather than by a line in a document.
      - name: Install the SQLite headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Build
        run: swift build

      - name: Run Tests
        run: swift test
