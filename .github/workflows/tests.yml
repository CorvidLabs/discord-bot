name: Tests

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/tests.yml"
  # Every pull request, not only those targeting main: work on this repository
  # arrives as a stack of branches, and a stacked pull request needs the same
  # gate as the one at the bottom of the stack.
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/tests.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted, not self-hosted: this repository is public, so a pull
    # request from a fork would otherwise run a stranger's code on a
    # maintainer's own machine.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Run Tests
        run: swift test
