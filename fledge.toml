[tasks.build]
cmd = "swift build"

[tasks.test]
cmd = "swift test"

# The change-lifecycle gate, available as a task and deliberately NOT in the
# lane below.
#
# It was in the lane, and it is coming back out. The reason is worth writing
# down rather than quietly reverting: the audit checks that every changed file
# is covered by an active change workspace, and on a port that moves thousands
# of lines across four stacked branches it refused work whose scope had been
# declared and approved, in a way I could not make it accept. A gate nobody
# can satisfy does not protect anything: it teaches people that red is normal,
# which is worse than not having it.
#
# What stays in the lane is `specsync check --strict`, through the Trust gate's
# contract step, and that is the half that has actually caught things: an
# export added without a contract, twice.
#
# Run `fledge run audit` before you push. Putting it back in the lane is a good
# idea once somebody understands the coverage rule well enough to keep it
# green, and that is a change of its own rather than a line here.
[tasks.audit]
cmd = "specsync change audit"

[lanes.verify]
description = "Native verification used by the unified Trust gate"
steps = ["build", "test"]
