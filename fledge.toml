[tasks.build]
cmd = "swift build"

[tasks.test]
cmd = "swift test"

# The change-lifecycle gate, in the lane so that CI runs it.
#
# The policy in `.specsync/sdd.json` refuses a meaningful path with no active
# change, and it refused this repository's own adoption before the workspace
# covering it existed. But refusing on a contributor's machine stops nobody:
# the Trust gate runs `specsync check` and this lane, and never ran the audit,
# so a pull request touching `Sources/` with no workspace went green and could
# be merged. "Refused by name rather than merged" was true locally and false
# on GitHub, which is the worst shape a rule can have.
#
# It lives in the lane rather than in a workflow step because `.trust.toml`
# gives the lane to the Trust gate as its lifecycle command, so this is the
# one place that makes the local answer and the CI answer the same answer.
[tasks.audit]
cmd = "specsync change audit"

[lanes.verify]
description = "Native verification used by the unified Trust gate"
steps = ["build", "test", "audit"]
